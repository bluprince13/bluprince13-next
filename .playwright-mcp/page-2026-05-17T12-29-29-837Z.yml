  - generic [ref=e20]:
    - heading "Values" [level=1] [ref=e21]
    - paragraph [ref=e22]: I was inspired by Kenneth Reitz's list of personal values to produce one of my own. The list isn't static, it will evolve with time. These aren't rules, only guidelines.
    - list [ref=e23]:
      - listitem [ref=e24]: Time is your only currency; allocate it sparingly.
      - listitem [ref=e25]: Obsession is an easy way to focus.
      - listitem [ref=e26]: Laziness is a virtue.
      - listitem [ref=e27]: Perfection is unattainable, but sometimes worth pursuing.
      - listitem [ref=e28]: Aim to fail often and learn from it; success is overrated.
      - listitem [ref=e29]: Intuition, logic and passion are a powerful combo.
      - listitem [ref=e30]: Calculated risks are less risky than taking no risks at all.
      - listitem [ref=e31]: Ask forgiveness, not permission.
      - listitem [ref=e32]: Collaboration beats competition.
      - listitem [ref=e33]: Never stop learning and therefore teaching.
      - listitem [ref=e34]: Ask for opinions, but feel free to disregard them.
      - listitem [ref=e35]: Never compromise on your honesty, loyalty and authenticity.
      - listitem [ref=e36]: Forgive others for your own inner peace.
      - listitem [ref=e37]: Believe that people are really good at heart; this is the foundation of hope.
      - listitem [ref=e38]: Family, friends and love comes first; life is relationships.
      - listitem [ref=e39]: Choose to be happy, if not for your own sake, for those who care about you.
      - listitem [ref=e40]: Be gentle with yourself.
